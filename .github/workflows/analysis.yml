name: Lint-Test-Mypy

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      id: setup-python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install and configure poetry
      uses: snok/install-poetry@v1
      with:
        virtualenvs-create: true
        virtualenvs-in-project: true
    - name: Load cached venv
      id: cached-venv
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-analysis-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
    - name: Install dependencies
      run: poetry install --no-interaction --no-root --all-extras --with analysis
      if: steps.cached-venv.outputs.cache-hit != 'true'
    - name: Install project
      run: poetry install --no-interaction --all-extras --with analysis

    - name: Analysing the code with pylint
      run: |
        source $VENV
        pylint src/ || pylint-exit $?

    - name: Running tests
      run: |
        source $VENV
        pytest tests/

    - name: Running Mypy analysis
      run: |
        source $VENV
        mypy src/
