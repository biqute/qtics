name: Docs

on:
  push:

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}


    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install and configure poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: Load cached venv
        id: cached-venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-docs-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
      - name: Install dependencies
        run: poetry install --no-interaction --no-root --all-extras --with analysis,docs
        if: steps.cached-venv.outputs.cache-hit != 'true'
      - name: Install project
        run: poetry install --no-interaction --all-extras --with analysis,docs


      - name: Compile documentation
        run: |
          sudo apt-get update
          sudo apt-get install python3-sphinx
          source $VENV
          make -C docs html


      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4

        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: '**/docs/build/html'
