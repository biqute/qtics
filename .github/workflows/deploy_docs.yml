name: Docs

on:
  push:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build into its own folder (e.g. v0.0.6)"
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}


    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install and configure poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: Load cached venv
        id: cached-venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-docs-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
      - name: Install dependencies
        run: poetry install --no-interaction --no-root --all-extras --with analysis,docs
        if: steps.cached-venv.outputs.cache-hit != 'true'
      - name: Install project
        run: poetry install --no-interaction --all-extras --with analysis,docs


      - name: Compile documentation
        run: |
          sudo apt-get update
          sudo apt-get install python3-sphinx
          source $VENV
          make -C docs html


      # The site root is the latest version (main), releases live in /<tag>/;
      # versions.json lists the latest version and the two most recent releases
      - name: Write versions.json
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python - <<'PY'
          import json, subprocess
          base = "https://biqute.github.io/qtics/"
          version = subprocess.run(
              ["poetry", "version", "--short"], capture_output=True, text=True, check=True
          ).stdout.strip()
          tags = subprocess.run(
              ["git", "tag", "--list", "v*", "--sort=-v:refname"],
              capture_output=True, text=True, check=True,
          ).stdout.split()
          # the release matching main is already "latest"
          tags = [tag for tag in tags if tag != f"v{version}"][:2]
          versions = [{"name": "latest", "version": version, "url": base}]
          versions += [{"name": tag, "url": f"{base}{tag}/"} for tag in tags]
          with open("docs/build/html/versions.json", "w") as file:
              json.dump(versions, file, indent=2)
          PY

      - name: Deploy latest
        uses: peaceiris/actions-gh-pages@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/build/html
          keep_files: true  # keep the release folders

      - name: Deploy release
        uses: peaceiris/actions-gh-pages@v4
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/build/html
          destination_dir: ${{ inputs.tag || github.ref_name }}
